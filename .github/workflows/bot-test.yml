name: HabitTeen bot test

on:
  push:
    branches:
      - feat/content-pools-100-and-30-levels-20260810
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check index.js
      - run: node --check src/levels-45.js
      - run: node --check src/content.js
      - run: node --check src/pools.js
      - run: node --check src/direct-pools.js
      - run: node --check src/level-context-pools.js
      - run: node --check src/problem-pools.js
      - run: node --check src/plain-secondary-gain.js
      - run: node --check src/life-meaning-pools.js
      - run: node --check src/level-output-pools.js
      - run: node --check src/independent-life-pools.js
      - run: node --check src/direct-body-copy.js
      - run: node --check src/body-state-pools.js
      - run: node --check src/after-state-lazy.js
      - run: node --check src/after-state-apathy.js
      - run: node --check src/after-state-procrastination.js
      - run: node --check src/concise-result-v3.js
      - run: node --check src/concise-result.js
      - run: node --check src/concise-generic-result.js
      - run: node --check src/generic-500-pools.js
      - run: node --check src/balanced-generic-result.js
      - run: node --check src/feeling-guide-intros.js
      - run: node --check src/feeling-guide-scenes.js
      - run: node --check src/feeling-guide.js
      - run: node --check src/feeling-continuation.js
      - run: node --check src/renderer.js
      - run: node --check src/generic-result.js
      - run: node --check src/navigation-keyboards.js
      - run: node --check tests/concise-flow.test.mjs
      - run: node --check tests/generic-500-flow.test.mjs
      - run: node --check tests/direct-body-copy.test.mjs
      - run: npm test
